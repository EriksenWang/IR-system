<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholar IR System - 学术搜索引擎</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #74ABE2, #5563DE);
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(255, 255, 255, 0.95);
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    header h1 { margin: 0; font-size: 22px; color: #2c3e50; }
    nav a { margin-left: 20px; text-decoration: none; font-weight: 500; color: #2c3e50; transition: color 0.3s; }
    nav a:hover { color: #5563DE; }

    .search-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      text-align: center;
    }
    .search-container h2 { font-size: 28px; color: white; margin-bottom: 20px; }
    .search-box {
      background: white;
      padding: 12px 20px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      margin-bottom: 15px;
    }

     /* n-gram checkbox 样式 */
    .ngram-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: 10px;
      font-size: 14px;
      color: #333;
    }
    .ngram-label input { transform: scale(1.05); }



    .search-box input { flex: 1; border: none; outline: none; font-size: 16px; padding: 8px; }
    .search-box button {
      background: linear-gradient(135deg, #5563DE, #74ABE2);
      border: none;
      color: white;
      font-size: 18px;
      border-radius: 50%;
      padding: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .search-box button:hover { background: linear-gradient(135deg, #2e3bb5, #3f5acb); transform: scale(1.1); }




    .search-row {
      position: relative;
      display: flex;
      flex-direction: column;    /* 垂直排列 */
      align-items: center;
      gap: 8px;                  /* 控制组件间距，改小 */
      justify-content: center;
      width: 100%;
      max-width: 900px;
      margin: auto;
    }
    .search-box-wrapper {
      position: relative;
      flex: 0 0 520px;
      display: flex;
      flex-direction: column;    /* 内部垂直排列：index-type / search-box / fields */
      align-items: center;
      gap: 6px;                  /* 内部元素间距更小 */
      width: 100%;
    }



    .spell-suggestion {
      position: absolute;
      right: 100%;           /* 放在 wrapper 左侧 */
      margin-right: 12px;    /* 间隙 */
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      background: rgba(0,0,0,0.15);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      min-width: 220px;
      text-align: left;
      display: none;         /* 隐藏时不占位 */
      pointer-events: auto;
      z-index: 50;
    }
    .spell-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      align-self: flex-end;     /* 放到 wrapper 右侧 */
      margin-top: 2px;
    }
    .spell-controls label { color:#fff; font-size:14px; display:flex; align-items:center; gap:6px; }



    .index-type {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 0;                 /* 移除额外底部间距 */
      width: 100%;
    }
    .index-type label {
      color: #fff;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.06);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }
    .index-type input[type="radio"] { transform: scale(1.02); }


    .fields-checkbox-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin-top: 4px;
      padding: 6px 8px;
      border-radius: 8px;
      box-sizing: border-box;
      background: rgba(255,255,255,0.04);
    }
    .fields-checkbox-group label { color: #fff; font-size: 13px; margin: 0 6px; }

    







    /* 筛选区 */
    .filters-container {
      width: 100%;
      max-width: 800px;
      margin-bottom: 20px;
      text-align: left;
    }
    .toggle-filters {
      background: #ffffffcc;
      border: none;
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 6px;
      margin-bottom: 10px;
      transition: background 0.3s, transform 0.3s;
    }
    .toggle-filters:hover { background: #ffffff; }
    .toggle-filters i { transition: transform 0.3s; }

    .filters {
      background: rgba(255,255,255,0.9);
      padding: 15px;
      border-radius: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      max-height: 0;       /* 收起时完全隐藏 */
      overflow: hidden;    /* 隐藏溢出内容 */
      transition: max-height 0.5s ease, padding 0.5s ease;
      padding: 0 15px;     /* 收起时去掉上下 padding */
    }
    .filters.show {
      max-height: 500px;   /* 展开显示完整内容 */
      padding: 15px;
    }
    .filters label { font-size: 14px; font-weight: 500; color: #333; display: block; margin-bottom: 5px; }
    .filters input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }

    .results {
      max-width: 1000px;
      margin: 20px auto 40px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    .result-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
      width: 100%; 
    }

    .advanced-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 25px auto 0 auto;
      padding: 12px 32px;
      font-size: 17px;
      font-weight: 500;
      border-radius: 28px;
      background: linear-gradient(135deg, #5563DE 60%, #74ABE2 100%);
      color: #fff;
      border: none;
      box-shadow: 0 4px 16px rgba(85,99,222,0.12);
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      letter-spacing: 1px;
    }
    .advanced-btn i {
      font-size: 18px;
    }
    .advanced-btn:hover {
      background: linear-gradient(135deg, #2e3bb5 60%, #74ABE2 100%);
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 8px 24px rgba(85,99,222,0.18);
    }

    .results-count {
      color: #fff;
      font-size: 15px;
      margin: 6px 0;
      text-align: center;
    }


    .year-range {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 6px;
    }
    .year-input {
      width: 110px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.12);
      font-size: 13px;
      box-sizing: border-box;
      background: #fff;
    }
    .range-sep { color: #fff; font-size: 14px; }



    #history-panel {
      position: fixed;
      top: 0;
      right: -350px;
      width: 320px;
      height: 100vh;
      background: #fff;
      box-shadow: -4px 0 18px rgba(85,99,222,0.15);
      z-index: 999;
      transition: right 0.35s cubic-bezier(.4,2.2,.2,1);
      display: flex;
      flex-direction: column;
    }
    #history-panel.show { right: 0; }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px 10px 20px;
      border-bottom: 1px solid #eee;
      font-size: 18px;
      color: #5563DE;
      font-weight: 600;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 26px;
      color: #aaa;
      cursor: pointer;
      transition: color 0.2s;
    }
    .close-btn:hover { color: #5563DE; }
    #history-list {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      margin: 0;
      list-style: none;
    }
    #history-list li {
      margin-bottom: 14px;
      font-size: 15px;
      color: #333;
      cursor: pointer;
      border-bottom: 1px dashed #eee;
      padding-bottom: 6px;
      transition: color 0.2s;
    }
    #history-list li:hover { color: #5563DE; }


    .result-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
    .result-card h3 { margin-top: 0; font-size: 18px; color: #5563DE; }
    .result-meta { font-size: 13px; color: #666; margin: 5px 0; }
    .result-meta i { margin-right: 4px; color: #5563DE; }
    .result-card p { font-size: 14px; color: #444; }
    .result-card a { text-decoration: none; color: #2e3bb5; font-weight: bold; font-size: 14px; }

    footer { background: rgba(44, 62, 80, 0.85); color: #ccc; text-align: center; padding: 15px; font-size: 14px; margin-top: auto; }
    footer a { color: #74ABE2; text-decoration: none; }
    footer a:hover { color: #fff; }
  </style>
</head>

<script>


function escapeHTML(s) {
  return String(s || "").replace(/[&<>"']/g, function(m) {
    return ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" })[m];
  });
}







let currentPage = 1;
const pageSize = 12;
const maxPage = 10;


function renderPagination(total) {
  const resultsDiv = document.getElementById("results");
  const totalPages = Math.min(Math.ceil(total / pageSize), maxPage);
  let html = `<div style="text-align:center;margin:20px 0;">`;
  html += `<button onclick="prevPage()" ${currentPage === 1 ? "disabled" : ""}>上一页</button>`;
  html += ` <span>第 ${currentPage} / ${totalPages} 页</span> `;
  html += `<button onclick="nextPage()" ${currentPage === totalPages ? "disabled" : ""}>下一页</button>`;
  html += `</div>`;
  resultsDiv.innerHTML += html;
}

function prevPage() {
  if (currentPage > 1) {
    currentPage--;
    search();
  }
}

function nextPage() {
  currentPage++;
  search();
}





function toggleFilters() {
  const filters = document.getElementById("filters");
  const arrow = document.getElementById("arrow");
  filters.classList.toggle("show");
  // 切换箭头方向
  if (filters.classList.contains("show")) {
    arrow.style.transform = "rotate(180deg)";
  } else {
    arrow.style.transform = "rotate(0deg)";
  }
}


function getFirstWords(text, n) {
  if (!text) return "";
  const words = text.split(/\s+/).filter(Boolean);
  return words.slice(0, n).join(" ") + (words.length > n ? " ..." : "");
}




function getSelectedFields() {
/*
  const fields = [];
  if (document.getElementById("title").value.trim()) fields.push("title");
  if (document.getElementById("author").value.trim()) fields.push("authors");
  if (document.getElementById("date").value.trim()) fields.push("publicationDate");
  if (document.getElementById("org").value.trim()) fields.push("affiliations");
  if (document.getElementById("location").value.trim()) fields.push("address");
  if (document.getElementById("fulltext").value.trim()) fields.push("fullText");
  return fields;
*/ 
  const checkboxes = document.querySelectorAll('input[name="fields"]:checked');
  return Array.from(checkboxes).map(cb => cb.value);

}

function search() {
/*
  const query = document.getElementById("query").value.trim();
  const title = document.getElementById("title").value.trim();
  const author = document.getElementById("author").value.trim();
  const date = document.getElementById("date").value.trim();
  const org = document.getElementById("org").value.trim();
  const location = document.getElementById("location").value.trim();
  const fulltext = document.getElementById("fulltext").value.trim();

  let q = query;
  if (title) q += ` ${title}`;
  if (author) q += ` ${author}`;
  if (date) q += ` ${date}`;
  if (org) q += ` ${org}`;
  if (location) q += ` ${location}`;
  if (fulltext) q += ` ${fulltext}`;
*/

  const q = document.getElementById("query").value.trim();
  const fields = getSelectedFields();
  saveSearchHistory(q, fields);

  // let url = `/search?q=${encodeURIComponent(q)}`;

  //let url = `/search?q=${encodeURIComponent(q)}&page=${currentPage}&size=${pageSize}`;

  //const useNgram = document.getElementById("use-ngram") && document.getElementById("use-ngram").checked;
  // 根据勾选切换到 ngram 专用接口（Controller 中已实现 /search/ngram）
  //let base = useNgram ? '/search/ngram' : '/search';
  //let url = `${base}?q=${encodeURIComponent(q)}&page=${currentPage}&size=${pageSize}`;

    // 根据上方单选选择索引类型：inverted / ngram / vec
  const idx = document.querySelector('input[name="index-type"]:checked')?.value || 'inverted';
  let base;
  if (idx === 'ngram') base = '/search/ngram';
  else if (idx === 'vec') base = '/search/vec';
  else base = '/search';
  let url = `${base}?q=${encodeURIComponent(q)}&page=${currentPage}&size=${pageSize}`;
  // 可为向量检索添加 k 参数（可选）
  if (idx === 'vec') url += `&k=20`;
  fields.forEach(f => url += `&fields=${encodeURIComponent(f)}`);


    // 年份范围参数（仅接受 4 位数字）
  const startRaw = document.getElementById("startYear")?.value.trim();
  const endRaw = document.getElementById("endYear")?.value.trim();
  const yRe = /^\d{4}$/;
  let sy = null, ey = null;
  if (startRaw && yRe.test(startRaw)) sy = parseInt(startRaw, 10);
  if (endRaw && yRe.test(endRaw)) ey = parseInt(endRaw, 10);
  // 如果两端都有且顺序反了则交换
  if (sy !== null && ey !== null && sy > ey) { const tmp = sy; sy = ey; ey = tmp; }
  if (sy !== null) url += `&startYear=${sy}`;
  if (ey !== null) url += `&endYear=${ey}`;

  fetch(url)
    .then(res => res.json())
    .then(data => {
      const resultsDiv = document.getElementById("results");
/*
      resultsDiv.innerHTML = "";
      if (!data || !data.results || data.results.length === 0) {

        resultsDiv.innerHTML = `
          <div style="text-align:center;">
            <img src="/images/muzimi.png" alt="未找到相关结果" style="width:180px;max-width:80%;margin:30px auto 10px auto;display:block;">
            <p style='color:white;text-align:center;font-size:18px;'>未找到相关结果</p>
          </div>
        `;

        return;
      }



      data.results.forEach(r => {
*/
        resultsDiv.innerHTML = "";
      // 无结果处理
        if (!data || !data.results || data.results.length === 0) {
          resultsDiv.innerHTML = `
            <div style="text-align:center;">
              <img src="/images/muzimi.png" alt="未找到相关结果" style="width:180px;max-width:80%;margin:30px auto 10px auto;display:block;">
              <p style='color:white;text-align:center;font-size:18px;'>未找到相关结果</p>
            </div>
          `;
          return;
        }

      // 显示总命中数（由后端返回的 data.total）
        const total = data.total != null ? data.total : data.results.length;
        resultsDiv.innerHTML = `<div class="results-count">共检索到 ${total} 篇</div>`;

      // 渲染每条结果卡片（原有代码）
      data.results.forEach(r => {

        const card = document.createElement("div");
        card.className = "result-card";
        // 拼接PDF相对路径（后端已映射 /pdfs/ 到 D:\Codes\IR-system\oriPDFs）
        const pdfUrl = `/pdfs/${encodeURIComponent(r.pdfFilename.replace('.json', '.pdf'))}`;

        // title: 优先使用高亮的 title（后端返回 highlightTitle），否则普通 title（需要 escape）
        const titleHtml = r.highlightTitle ? r.highlightTitle : escapeHTML(r.title || "");

        // snippet: 优先使用后端生成的 highlight（HTML），否则截取全文的纯文本片段（escape）
        const snippetHtml = r.highlight ? r.highlight : escapeHTML(getFirstWords(r.fullText, 30));

        card.innerHTML = `
          <a href="${pdfUrl}" target="_blank" style="text-decoration:none;color:inherit;">
            <h3>${titleHtml}</h3>
            <div class="result-meta"><b>作者:</b> ${escapeHTML(r.authors || "")} | <b>时间:</b> ${escapeHTML(r.publicationDate || "")}</div>
            <div class="result-meta"><b>机构:</b> ${escapeHTML(r.affiliations || "")} | <b>地址:</b> ${escapeHTML(r.address || "")}</div>
            <p>${snippetHtml}</p>
            <div style="color:#2e3bb5;font-size:13px;margin-top:8px;">点击查看原文PDF</div>
          </a>
        `;
        resultsDiv.appendChild(card);
      });
      renderPagination(data.total);
    })
    .catch(err => {
      document.getElementById("results").innerHTML = err+ "<p style='color:white;text-align:center;'>查询出错</p>";
      console.error(err);
    });
}

// 搜索框按回车触发
document.getElementById("query").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    currentPage = 1; // 重置页码
    search();
  }

});


// 打开/关闭历史面板
document.getElementById("history-btn").onclick = function(e) {
  e.preventDefault();
  renderSearchHistory();
  document.getElementById("history-panel").classList.add("show");
};
function closeHistory() {
  document.getElementById("history-panel").classList.remove("show");
}

// 保存历史
function saveSearchHistory(q, fields) {
  let history = JSON.parse(localStorage.getItem("searchHistory") || "[]");
  // 去重（只保留最新一次）
  history = history.filter(item => item.q !== q || JSON.stringify(item.fields) !== JSON.stringify(fields));
  history.unshift({ q, fields, time: new Date().toLocaleString() });
  history = history.slice(0, 20);
  localStorage.setItem("searchHistory", JSON.stringify(history));
}

// 渲染历史
function renderSearchHistory() {
  const list = document.getElementById("history-list");
  let history = JSON.parse(localStorage.getItem("searchHistory") || "[]");
  if (history.length === 0) {
    list.innerHTML = "<li style='color:#aaa;'>暂无历史记录</li>";
    return;
  }
  list.innerHTML = "";
  history.forEach(item => {
    const li = document.createElement("li");
    li.textContent = item.q;
    li.title = item.q + " [" + (item.fields || []).join(", ") + "]";
    li.onclick = function() {
      document.getElementById("query").value = item.q;
      // 勾选字段
      document.querySelectorAll('input[name=\"fields\"]').forEach(cb => {
        cb.checked = (item.fields || []).includes(cb.value);
      });
      closeHistory();
      currentPage = 1;
      search();
    };
    list.appendChild(li);
  });
}




// 防抖工具
function debounce(fn, wait) {
  let t;
  return function(...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), wait);
  };
}

const fetchSpellSuggestion = debounce(function() {
  const useSpell = document.getElementById("use-spell").checked;
  const area = document.getElementById("spell-area");
  if (!useSpell) {
    area.style.display = "none";
    return;
  }
  const q = document.getElementById("query").value.trim();
  if (!q) {
    area.style.display = "none";
    return;
  }
  fetch(`/search/spell?q=${encodeURIComponent(q)}&max=1`)
    .then(r => r.json())
    .then(data => {
      if (data && data.corrected && data.corrected !== data.original) {
        area.style.display = "block";
        area.innerHTML = `你要找的是不是： <a href="#" id="spell-fill" style="color:#ffd966;text-decoration:underline;">${data.corrected}</a>`;
        document.getElementById("spell-fill").onclick = function(e) {
          e.preventDefault();
          document.getElementById("query").value = data.corrected;
          area.style.display = "none";
          currentPage = 1;
          search();
        };
      } else {
        area.style.display = "none";
      }
    })
    .catch(err => {
      console.error("spell error", err);
      area.style.display = "none";
    });
}, 300);// 300ms debounce

// 绑定输入事件（支持多词，因为后端逐 token 纠错）
document.getElementById("query").addEventListener("input", fetchSpellSuggestion);
document.getElementById("use-spell").addEventListener("change", fetchSpellSuggestion);



















</script>

  <div class="history-header">
    <span>搜索历史</span>
    <button onclick="closeHistory()" class="close-btn">&times;</button>
  </div>
  <ul id="history-list"></ul>
</div>
