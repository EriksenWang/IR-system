    #advanced-search {
    margin-top: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    }


    /* 搜索条件行横向排列 */
    .search-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    justify-content: center;
    }

    /* 搜索条件下拉框和输入框宽度统一 */
    .search-row select,
    .search-row input {
    font-size: 15px;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    min-width: 110px;
    max-width: 180px;
    box-sizing: border-box;
    }

    /* 加减按钮样式 */
    .search-row button {
    background: #5563DE;
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    font-size: 18px;
    cursor: pointer;
    margin-left: 5px;
    transition: background 0.2s;
    }
    .search-row button:hover {
    background: #2e3bb5;
    }

    /* 检索按钮居中显示 */
    button[onclick^="advancedSearch"] {
    margin-top: 30px;
    display: block;
    margin: 20px auto 10px auto;
    padding: 10px 30px;
    font-size: 16px;
    border-radius: 25px;
    background: linear-gradient(135deg, #5563DE, #74ABE2);
    color: #fff;
    border: none;
    cursor: pointer;
    transition: background 0.3s;
    }
    button[onclick^="advancedSearch"]:hover {
    background: linear-gradient(135deg, #2e3bb5, #3f5acb);
    }

    /* 检索结果卡片一行三列 */
    #results {
    margin-top: 40px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    max-width: 1100px;
    margin: 30px auto 40px auto;
    padding: 0 20px;
    }

    /* 卡片样式优化 */
    .result-card {
    background: white;
    padding: 20px;
    border-radius: 12px;

<body>

<header>

<div class="main-content">
  <button id="back-home" onclick="window.location.href='index.html'">返回首页</button>
  <div id="advanced-search"></div>
  <button onclick="advancedSearch(1)">检索</button>
  <div id="results"></div>
</div>





<script>



let advConditions = [
  { field: "title", op: "AND", value: "" }
];

function renderAdvancedSearch() {
  const container = document.getElementById("advanced-search");
  container.innerHTML = "";
  advConditions.forEach((cond, idx) => {
    container.innerHTML += `
      <div class="search-row" style="margin-bottom:10px;">
        ${idx > 0 ? `
          <select onchange="changeAdvOp(${idx}, this.value)">
            <option value="AND" ${cond.op==="AND"?"selected":""}>AND</option>
            <option value="OR" ${cond.op==="OR"?"selected":""}>OR</option>
            <option value="NOT" ${cond.op==="NOT"?"selected":""}>NOT</option>
          </select>
        ` : ""}
        <select onchange="changeAdvField(${idx}, this.value)">
          <option value="title" ${cond.field==="title"?"selected":""}>标题</option>
          <option value="authors" ${cond.field==="authors"?"selected":""}>作者</option>
          <option value="publication_date" ${cond.field==="publication_date"?"selected":""}>日期</option>
          <option value="affiliations" ${cond.field==="affiliations"?"selected":""}>机构</option>
          <option value="address" ${cond.field==="address"?"selected":""}>地址</option>
          <option value="full_text" ${cond.field==="full_text"?"selected":""}>全文</option>
        </select>
        <input type="text" value="${cond.value}" oninput="changeAdvValue(${idx}, this.value)" placeholder="请输入关键词">
        ${advConditions.length > 1 ? `<button onclick="removeAdvCondition(${idx})">-</button>` : ""}
        ${idx === advConditions.length - 1 ? `<button onclick="addAdvCondition()">+</button>` : ""}
      </div>
    `;
  });
}
function addAdvCondition() {
  advConditions.push({ field: "title", op: "AND", value: "" });
  renderAdvancedSearch();
}
function removeAdvCondition(idx) {
  advConditions.splice(idx, 1);
  renderAdvancedSearch();
}
function changeAdvOp(idx, val) { advConditions[idx].op = val; }
function changeAdvField(idx, val) { advConditions[idx].field = val; }
function changeAdvValue(idx, val) { advConditions[idx].value = val; }

renderAdvancedSearch();

function buildAdvLuceneQuery() {
  let query = "";
  advConditions.forEach((cond, idx) => {
    if (!cond.value.trim()) return;
    if (idx > 0) query += ` ${cond.op} `;
    // 精确短语可加引号，这里简单处理
    query += `${cond.field}:"${cond.value.trim()}"`;
  });
  return query;
}

let advCurrentPage = 1;
const advPageSize = 12;
let advTotal = 0;

function advancedSearch(page = 1) {
  advCurrentPage = page;
  const q = buildAdvLuceneQuery();
  let url = `/search?q=${encodeURIComponent(q)}&page=${advCurrentPage}&size=${advPageSize}`;
  fetch(url)
    .then(res => res.json())
    .then(data => {
      advTotal = data.total || 0;
      renderAdvResults(data.results || []);
      renderAdvPagination();
    });
}

function renderAdvResults(results) {
  const resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";
  if (!results || results.length === 0) {
    resultsDiv.innerHTML = "<p style='color:white;text-align:center;'>未找到相关结果</p>";
    return;
  }
  results.forEach(r => {
    const pdfUrl = `/pdfs/${encodeURIComponent((r.pdfFilename || r.json_filename || "").replace('.json', '.pdf'))}`;
    const card = document.createElement("div");
    card.className = "result-card";
    card.innerHTML = `
      <a href="${pdfUrl}" target="_blank" style="text-decoration:none;color:inherit;">
        <h3>${r.title || ""}</h3>
        <div class="result-meta"><b>作者:</b> ${r.authors || ""} | <b>时间:</b> ${r.publicationDate || ""}</div>
        <div class="result-meta"><b>机构:</b> ${r.affiliations || ""} | <b>地址:</b> ${r.address || ""}</div>
        <p>${(r.fullText || "").split(/\s+/).slice(0, 10).join(" ")}...</p>
        <div style="color:#2e3bb5;font-size:13px;margin-top:8px;">点击查看原文PDF</div>
      </a>
    `;
    resultsDiv.appendChild(card);
  });
}

function renderAdvPagination() {
  const resultsDiv = document.getElementById("results");
  const totalPages = Math.min(Math.ceil(advTotal / advPageSize), 10);
  if (totalPages <= 1) return;
  let html = `<div style="text-align:center;margin:20px 0;">`;
  html += `<button onclick="advancedSearch(${advCurrentPage - 1})" ${advCurrentPage === 1 ? "disabled" : ""}>上一页</button>`;
  html += ` <span>第 ${advCurrentPage} / ${totalPages} 页</span> `;
  html += `<button onclick="advancedSearch(${advCurrentPage + 1})" ${advCurrentPage === totalPages ? "disabled" : ""}>下一页</button>`;
  html += `</div>`;
  resultsDiv.innerHTML += html;
}


</script>
